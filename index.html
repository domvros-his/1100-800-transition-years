const glossary={
  'ανάκαμψη':'Ανάκαμψη σημαίνει ότι, μετά από μια δύσκολη περίοδο, τα πράγματα αρχίζουν ξανά να πηγαίνουν καλύτερα.',

  'προφορική παράδοση':'Προφορική παράδοση σημαίνει ιστορίες και τραγούδια που μεταδίδονται με το στόμα, από άνθρωπο σε άνθρωπο.',
  'φωνήεντα':'Φωνήεντα είναι τα γράμματα α, ε, η, ι, ο, υ, ω.',
  'γεωμετρική τέχνη':'Γεωμετρική τέχνη είναι η τέχνη που χρησιμοποιεί σχήματα όπως κύκλους, τρίγωνα, ρόμβους και μαιάνδρους.',

  'πολιτισμική αναγέννηση':'Πολιτισμική αναγέννηση σημαίνει ότι ο πολιτισμός δυναμώνει ξανά και εμφανίζονται νέες δημιουργίες.',

  'ομηρικά έπη':'Ομηρικά έπη είναι η Ιλιάδα και η Οδύσσεια.',
  'μεταβατικοί χρόνοι':'Μεταβατικοί χρόνοι είναι η περίοδος από το 1100 έως το 800 π.Χ., ανάμεσα στην πτώση του μυκηναϊκού κόσμου και στη νέα ανάπτυξη.'
};
function gloss(html){
  const wrap=(term)=>`<button type="button" class="term" data-word="${term}" data-def="${glossary[term]}"><b>${term}</b><span class="term-icon" aria-hidden="true">?</span></button>`;
  ['μεταβατικοί χρόνοι','στενότητα χώρου','προφορική παράδοση','πολιτισμική αναγέννηση','πανελλήνια σημασία','γεωμετρική τέχνη','φοινικικό αλφάβητο','ομηρικά έπη','ανάκαμψη','αποικισμός','φωνήεντα'].forEach(term=>{
    const re=new RegExp(`<b>${term}</b>`,'gi');
    html=html.replace(re, wrap(term));
  });
  return html
}

isten').onclick=()=>{stop();if(!window.speechSynthesis){alert('Η ανάγνωση δεν υποστηρίζεται από αυτόν τον browser.');return}if(speechSynthesis.speaking){speechSynthesis.cancel();return}let s=stages[index],u=new SpeechSynthesisUtterance(s.title+'. '+($('answer').hidden?s.q:$('answer').innerText));u.lang='el-GR';u.rate=.88;let voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('el'));if(!voice){alert('Δεν βρέθηκε ελληνική φωνή στη συσκευή. Μπορείς να προσθέσεις ελληνική φωνή στις ρυθμίσεις της.');return}u.voice=voice;speechSynthesis.speak(u)};$('prev').onclick=()=>{stop();show(index-1)};$('next').onclick=()=>{stop();show(index+1)};$('reset').onclick=()=>{stop();show(0)};$('play').onclick=()=>{if(timer!==null){stop();return}if(index===stages.length-1)show(0);$('play').textContent='Ⅱ Παύση';$('play').setAttribute('aria-pressed','true');timer=setInterval(()=>show(index+1),18000)};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('full').textContent='Μη διαθέσιμη πλήρης οθόνη'}};document.addEventListener('fullscreenchange',()=>$('full').textContent=document.fullscreenElement?'⛶ Έξοδος':'⛶ Πλήρης οθόνη');document.addEventListener('keydown',e=>{if($('mapViewer').open)return;if(['BUTTON','SELECT','INPUT'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){stop();show(index+1)}if(e.key==='ArrowLeft'){stop();show(index-1)}});show(0);
</script></body></html>
